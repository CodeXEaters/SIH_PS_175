services:
  - type: web
    name: depthwizard
    env: docker
    dockerfilePath: Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: FREE_TIER_MODE
        value: "true"
      - key: FREE_TIER_MAX_INPUT_PIXELS
        value: 1048576
      - key: FREE_TIER_MODEL_INPUT
        value: 518
      - key: MAX_IMAGE_DIM
        value: 256
      - key: WEB_CONCURRENCY
        value: 1
      - key: API_MAX_UPLOAD_BYTES
        value: 10485760
      - key: API_CORS_ORIGINS
        value: "*"
      - key: DEPTH_CHECKPOINT
        value: /app/models/checkpoints/depth_anything_v2_vits.pt
      - key: DEPTH_MODEL_URL
        sync: false
